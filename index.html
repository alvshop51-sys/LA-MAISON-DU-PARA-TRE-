
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALV SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;padding:20px}
.wrap{max-width:650px;margin:auto}
h1,h2{color:#d6ad50;text-align:center}
.card{background:#1d1d1d;border:1px solid #8c6a29;border-radius:14px;padding:18px;margin:15px 0}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #777;font-size:16px}
input,select{background:#292929;color:white}
button{background:#c99d3d;color:#111;font-weight:bold;border:0}
button:active{opacity:.8}
.small{color:#bbb;font-size:13px;text-align:center}
.hidden{display:none}
.total{font-size:28px;text-align:center;color:#e6bd60;font-weight:bold}
.sale{border-bottom:1px solid #555;padding:12px 0}
.sale button{width:auto;padding:8px 12px}
</style>
</head>
<body>
<div class="wrap">

<section id="login" class="card">
<h1>ALV SHOP</h1>
<h2>Connexion administrateur</h2>
<input id="password" type="password" placeholder="Mot de passe">
<button onclick="login()">Se connecter</button>
<p id="error" class="small"></p>
</section>

<main id="dashboard" class="hidden">
<h1>ALV SHOP</h1>
<p class="small">Tableau de bord administrateur</p>

<div class="card">
<h2>Nouvelle vente</h2>
<input id="client" placeholder="Nom du client">
<input id="phone" placeholder="Téléphone du client">

<select id="product" onchange="updatePrice()">
<option value="">Choisir un abonnement</option>
<option value="Netflix|1 mois|2600">Netflix – 1 mois : 2 600 F</option>
<option value="Netflix|2 mois|4500">Netflix – 2 mois : 4 500 F</option>
<option value="Netflix|3 mois|6500">Netflix – 3 mois : 6 500 F</option>
<option value="Netflix|6 mois|12000">Netflix – 6 mois : 12 000 F</option>
<option value="Netflix|1 an|25000">Netflix – 1 an : 25 000 F</option>
<option value="Prime|1 mois|2000">Prime – 1 mois : 2 000 F</option>
<option value="Prime|2 mois|3500">Prime – 2 mois : 3 500 F</option>
<option value="Prime|3 mois|5000">Prime – 3 mois : 5 000 F</option>
<option value="Prime|6 mois|9000">Prime – 6 mois : 9 000 F</option>
<option value="Prime|1 an|20000">Prime – 1 an : 20 000 F</option>
</select>

<p id="price" class="small">Montant : —</p>

<select id="payment">
<option>Airtel Money</option>
<option>Moov Money</option>
<option>Recharge</option>
<option>PayPal</option>
</select>

<select id="status">
<option value="Confirmé">Confirmé</option>
<option value="En attente">En attente</option>
</select>

<button onclick="addSale()">Enregistrer la vente</button>
</div>

<div class="card">
<h2>Total des recettes confirmées</h2>
<div id="total" class="total">0 FCFA</div>
</div>

<div class="card">
<h2>Historique des ventes</h2>
<div id="history">Aucune vente enregistrée.</div>
</div>

<button onclick="logout()">Se déconnecter</button>
</main>
</div>

<script>
const ADMIN_PASSWORD = "ADENA12";
const STORAGE_KEY = "alvshop_sales_demo";
let sales = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function login(){
  if(document.getElementById("password").value === ADMIN_PASSWORD){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("error").textContent="";
    render();
  }else{
    document.getElementById("error").textContent="Mot de passe incorrect.";
  }
}

function logout(){
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("password").value="";
}

function updatePrice(){
  const value=document.getElementById("product").value;
  document.getElementById("price").textContent =
    value ? "Montant : "+Number(value.split("|")[2]).toLocaleString("fr-FR")+" FCFA" : "Montant : —";
}

function addSale(){
  const client=document.getElementById("client").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const product=document.getElementById("product").value;
  if(!client || !product){
    alert("Entre le nom du client et choisis un abonnement.");
    return;
  }
  const parts=product.split("|");
  sales.unshift({
    client,phone,
    service:parts[0],
    duration:parts[1],
    amount:Number(parts[2]),
    payment:document.getElementById("payment").value,
    status:document.getElementById("status").value,
    date:new Date().toLocaleString("fr-FR")
  });
  save();
  document.getElementById("client").value="";
  document.getElementById("phone").value="";
  document.getElementById("product").value="";
  updatePrice();
  render();
  alert("Vente enregistrée !");
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(sales));
}

function render(){
  const total=sales.filter(s=>s.status==="Confirmé")
    .reduce((sum,s)=>sum+s.amount,0);
  document.getElementById("total").textContent=total.toLocaleString("fr-FR")+" FCFA";

  const history=document.getElementById("history");
  if(!sales.length){
    history.textContent="Aucune vente enregistrée.";
    return;
  }
  history.innerHTML="";
  sales.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="sale";
    const details=document.createElement("div");
    details.textContent=s.client+" — "+s.service+" ("+s.duration+")";
    const amount=document.createElement("strong");
    amount.textContent=s.amount.toLocaleString("fr-FR")+" FCFA";
    const info=document.createElement("p");
    info.className="small";
    info.textContent=s.date+" | "+s.payment+" | "+s.status;
    const del=document.createElement("button");
    del.textContent="Supprimer";
    del.onclick=()=>{
      if(confirm("Supprimer cette vente ?")){
        sales.splice(i,1);
        save();
        render();
      }
    };
    div.append(details,amount,info,del);
    history.appendChild(div);
  });
}
</script>
</body>
</html>
